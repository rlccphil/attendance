<!DOCTYPE html>
<html>
<head>
    <title><?= appTitle ?> - Check-In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 40px auto; background: #f9f9f9; }
        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #219653; }
        #statusMessage { display: none; text-align: center; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2><?= appTitle ?></h2>
        
        <form id="attendanceForm">
            <input type="hidden" id="sessionId" value="<?= sessionId ?>">
            <input type="hidden" id="qrId" value="<?= qrId ?>">
            
            <!-- Dynamically render fields passed from Settings -->
            <? var fields = formFields; ?>
            <? for (var i = 0; i < fields.length; i++) { ?>
                <label for="field_<?= i ?>"><?= fields[i] ?></label>
                <input type="text" id="field_<?= i ?>" name="<?= fields[i] ?>" required placeholder="Enter your <?= fields[i].toLowerCase() ?>">
            <? } ?>
            
            <button type="submit" id="submitBtn">Submit Attendance</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        const webAppUrl = "<?= url ?>";
        const formFields = JSON.parse('<?= JSON.stringify(formFields) ?>');

        document.getElementById("attendanceForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const btn = document.getElementById("submitBtn");
            const statusDiv = document.getElementById("statusMessage");
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const sessionId = document.getElementById("sessionId").value;
            const qrId = document.getElementById("qrId").value;

            // Build dynamic query parameters based on configured form fields
            let targetUrl = `${webAppUrl}?action=submit&sessionId=${encodeURIComponent(sessionId)}&qrId=${encodeURIComponent(qrId)}`;
            
            for (let i = 0; i < formFields.length; i++) {
                const val = document.getElementById(`field_${i}`).value;
                targetUrl += `&${encodeURIComponent(formFields[i])}=${encodeURIComponent(val)}`;
            }

            fetch(targetUrl)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("attendanceForm").style.display = "none";
                    statusDiv.style.display = "block";

                    if(data.status === "success") {
                        statusDiv.innerHTML = "<h3 style='color: #27ae60;'>Success!</h3><p>Your attendance has been recorded.</p>";
                    } else {
                        statusDiv.innerHTML = `<h3 style='color: #e74c3c;'>Submission Denied</h3><p>${data.message}</p>`;
                    }
                })
                .catch(error => {
                    btn.innerText = "Submit Attendance";
                    btn.disabled = false;
                    alert("Network error. Please try again.");
                });
        });
    </script>
</body>
</html>
