:root {
  --brand: #365233;
  --brand-deep: #263b24;
  --brand-ink: #1b2a19;
  --leaf: #e6ede4;
  --leaf-strong: #cfdccb;
  --paper: #eef2ec;
  --white: #ffffff;
  --line: #d8e0d5;
  --muted: #61705e;
  --danger: #9a3629;
  --danger-bg: #f7e5e1;
  --radius: 14px;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  -webkit-font-smoothing: antialiased;
  font-family: var(--font);
  color: var(--brand-ink);
  background: var(--paper);
  line-height: 1.5;
}

img { max-width: 100%; display: block; }

:focus-visible {
  outline: 3px solid #86a982;
  outline-offset: 2px;
}

[hidden] { display: none !important; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 13px 22px;
  font: 700 15px/1 var(--font);
  cursor: pointer;
  transition: background-color .15s, border-color .15s, opacity .15s;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn-primary { background: var(--brand); color: var(--white); }
.btn-primary:hover:not(:disabled) { background: var(--brand-deep); }

.btn-light { background: var(--white); color: var(--brand); }
.btn-light:hover:not(:disabled) { background: var(--leaf); }

.btn-outline-light { background: transparent; color: var(--white); border-color: rgba(255,255,255,.55); }
.btn-outline-light:hover:not(:disabled) { background: rgba(255,255,255,.12); border-color: var(--white); }

.btn-outline { background: transparent; color: var(--brand); border-color: var(--brand); }
.btn-outline:hover:not(:disabled) { background: var(--leaf); }

.btn-small { padding: 9px 14px; font-size: 13px; }

/* ---------- Form fields ---------- */
.field { margin-bottom: 18px; }
.field label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.field input {
  width: 100%;
  padding: 14px;
  font: 500 16px var(--font);
  color: var(--brand-ink);
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: 10px;
  transition: border-color .15s;
}
.field input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px rgba(54,82,51,.18); }
.field input::placeholder { color: #9aa797; font-weight: 400; }

/* ---------- Messages ---------- */
.notice {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  background: var(--leaf);
  color: var(--brand);
}
.notice-error { background: var(--danger-bg); color: var(--danger); }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(27, 42, 25, .6);
  z-index: 50;
}
.modal-overlay.open { display: flex; }
.modal {
  width: 100%; max-width: 380px;
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.modal h2 { margin: 0 0 8px; font-size: 20px; color: var(--brand); }
.modal p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
.modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.modal .field { text-align: left; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

    #qrcode img, #qrcode canvas { width: 100% !important; height: auto !important; max-width: 270px; }

    .state { text-align: center; }
    .state svg { width: 54px; height: 54px; margin: 0 auto 12px; }
    .state strong { display: block; font-size: 18px; color: var(--brand); }
    .state span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
    .state.closed strong { color: var(--danger); }

    .countdown { height: 7px; background: var(--leaf); display: none; }
    .countdown > i { display: block; height: 100%; width: 100%; background: var(--brand); }
    #timerDisplay { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: #d3e0cf; min-height: 20px; }

    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .actions .btn { min-width: 150px; }

    /* ----- Roster ----- */
    .roster {
      display: flex; flex-direction: column;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 36px -26px rgba(38,59,36,.5);
    }
    .roster-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 14px;
    }
    .roster-head h2 { margin: 0; font-size: 19px; font-weight: 800; color: var(--brand); display: flex; align-items: center; gap: 10px; }
    .count {
      min-width: 32px; text-align: center;
      background: var(--brand); color: var(--white);
      padding: 3px 11px; border-radius: 999px;
      font-size: 14px; font-weight: 700;
    }
    .roster-head small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }

    .table-wrap { flex: 1; max-height: 440px; overflow: auto; border-radius: 12px; background: #f8faf7; border: 1px solid var(--leaf); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    th { position: sticky; top: 0; background: var(--leaf); padding: 11px 14px; font-size: 12px; color: var(--brand); font-weight: 700; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--leaf); background: var(--white); }
    tr:last-child td { border-bottom: 0; }
    .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .avatar {
      flex: none; width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--leaf); color: var(--brand);
      font-size: 12px; font-weight: 800;
    }
    .time-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--leaf); color: var(--brand); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .empty-state { text-align: center; color: var(--muted); padding: 46px 16px !important; }
    .empty-state svg { width: 40px; height: 40px; margin: 0 auto 10px; opacity: .8; }

    #pageError { max-width: 1040px; margin: 20px auto 0; padding: 0 20px; }

    @media (max-width: 780px) {
      .layout { grid-template-columns: minmax(0, 1fr); margin-top: 18px; }
      .topbar { padding: 10px 16px; }
      .topbar img { height: 38px; }
      .stage { padding: 28px 18px 22px; }
    }
  </style>
</head>

  <script>// Tiny helper shared by both pages: talks to the Apps Script JSON API.
(function () {
  var cfg = window.APP_CONFIG || {};

  window.rlccApi = function (params) {
    var base = cfg.WEB_APP_URL || "";
    if (!base || base.indexOf("PASTE_") === 0) {
      return Promise.reject(new Error("not-configured"));
    }
    var qs = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    }).join("&");
    var url = base + (base.indexOf("?") > -1 ? "&" : "?") + qs;
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("http-" + res.status);
      return res.json();
    });
  };

  window.rlccEsc = function (value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
})();
</script>
  <script>
    var settings = { appTitle: "Attendance", showLiveList: true, interval: 15, pinRequired: false };
    var pin = sessionStorage.getItem("staffPin") || "";

    var autoRefreshTimer = null, countdownTimer = null, liveListInterval = null;
    var secondsRemaining = 15;
    var isRunning = false;
    var activeSessionId = "";

    var $ = function (id) { return document.getElementById(id); };
    var startBtn = $("startBtn"), stopBtn = $("stopBtn");

    var EMPTY_ICON = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#e6ede4"/><path d="M24 11c-6 4-9 9-9 14 0 5 4 9 9 12 5-3 9-7 9-12 0-5-3-10-9-14Z" fill="#365233"/><path d="M24 17v20" stroke="#e6ede4" stroke-width="2" stroke-linecap="round"/></svg>';

    function emptyRow(cols, text) {
      return '<tr><td class="empty-state" colspan="' + cols + '">' + EMPTY_ICON + "<div>" + rlccEsc(text) + "</div></td></tr>";
    }
    $("attendeeTableBody").innerHTML = emptyRow(2, "No session yet. Start one to see check-ins here.");

    function setLive(on, text) {
      $("liveChip").className = "chip" + (on ? " live" : "");
      $("liveText").textContent = text;
    }

    function initials(name) {
      var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      var a = parts[0].charAt(0), b = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
      return (a + b).toUpperCase();
    }

    function staff(params) {
      if (pin) params.pin = pin;
      return window.rlccApi(params).then(function (data) {
        if (data && data.status === "denied") {
          sessionStorage.removeItem("staffPin");
          pin = "";
          showPin("That PIN didn't match. Try again.");
          throw new Error("denied");
        }
        return data;
      });
    }

    function showPageError(msg) {
      $("pageErrorText").textContent = msg;
      $("pageError").hidden = false;
    }

    function setState(kind, title, sub) {
      var el = $("statusBanner");
      el.className = "state" + (kind === "closed" ? " closed" : "");
      $("statusTitle").textContent = title;
      $("statusSub").textContent = sub;
      el.style.display = "block";
      $("qrcode").style.display = "none";
      $("qrcode").innerHTML = "";
      $("countdown").style.display = "none";
      $("timerDisplay").textContent = "";
    }

    // ---------- Startup ----------
    function init() {
      window.rlccApi({ action: "config" }).then(function (cfg) {
        if (cfg.status !== "success") throw new Error("bad-config");
        settings = cfg;
        $("appTitle").textContent = cfg.appTitle;
        document.title = cfg.appTitle + " | Real Life Christian Communities";
        if (!cfg.showLiveList) {
          $("rosterCard").hidden = true;
          $("layout").classList.add("solo");
        }
        if (cfg.pinRequired && !pin) showPin(""); else resumeIfNeeded();
      }).catch(function (err) {
        if (err.message === "not-configured") {
          showPageError("Setup needed: open config.js and paste your Apps Script web app URL.");
        } else {
          showPageError("Can't reach the attendance service. Check the web app URL in config.js and that the deployment allows access for Anyone.");
        }
      });
    }

    function resumeIfNeeded() {
      var saved = localStorage.getItem("activeSessionId");
      if (!saved) return;
      activeSessionId = saved;
      isRunning = true;
      startBtn.textContent = "Resume session";
      setLive(true, "Session open");
      setState("paused", "Session in progress", "Press Resume session to show the code again.");
      if (settings.showLiveList) {
        fetchLiveAttendees();
        liveListInterval = setInterval(fetchLiveAttendees, 30000);
      }
    }

    // ---------- PIN ----------
    function showPin(message) {
      var err = $("pinError");
      err.hidden = !message;
      err.textContent = message || "";
      $("pinModal").classList.add("open");
      $("pinInput").value = "";
      $("pinInput").focus();
    }

    $("pinForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = $("pinBtn");
      btn.disabled = true; btn.textContent = "Checking...";
      var attempt = $("pinInput").value;
      window.rlccApi({ action: "auth", pin: attempt }).then(function (res) {
        btn.disabled = false; btn.textContent = "Continue";
        if (res.status === "success") {
          pin = attempt;
          sessionStorage.setItem("staffPin", pin);
          $("pinModal").classList.remove("open");
          resumeIfNeeded();
        } else {
          showPin("That PIN didn't match. Try again.");
        }
      }).catch(function () {
        btn.disabled = false; btn.textContent = "Continue";
        showPin("Couldn't check the PIN. Check your connection and try again.");
      });
    });

    // ---------- QR cycle ----------
    function checkInLink(qrId) {
      var base = new URL("checkin.html", window.location.href).href;
      return base + "?sessionId=" + encodeURIComponent(activeSessionId) + "&qrId=" + encodeURIComponent(qrId);
    }

    function runBar(seconds) {
      var bar = $("countdownBar");
      bar.style.transition = "none";
      bar.style.width = "100%";
      void bar.offsetWidth;
      bar.style.transition = "width " + seconds + "s linear";
      bar.style.width = "0%";
    }

    function startAutoCycle() {
      clearTimeout(autoRefreshTimer);
      clearInterval(countdownTimer);

      if (!activeSessionId) {
        activeSessionId = "SESSION_" + new Date().toISOString().replace(/[-:T.]/g, "").slice(0, 14);
        localStorage.setItem("activeSessionId", activeSessionId);
      }

      startBtn.textContent = isRunning ? "Refreshing..." : "Starting...";
      startBtn.disabled = true;
      stopBtn.disabled = true;

      staff({ action: "newSession" }).then(function (data) {
        isRunning = true;
        setLive(true, "Session live");
        $("statusBanner").style.display = "none";
        var qr = $("qrcode");
        qr.style.display = "block";
        qr.innerHTML = "";
        new QRCode(qr, {
          text: checkInLink(data.qrId),
          width: 270, height: 270,
          colorDark: "#1b2a19", colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        var interval = data.interval || 15;
        secondsRemaining = interval;
        $("countdown").style.display = "block";
        runBar(interval);
        $("timerDisplay").textContent = "New code in " + secondsRemaining + "s";
        countdownTimer = setInterval(function () {
          secondsRemaining--;
          if (secondsRemaining > 0) $("timerDisplay").textContent = "New code in " + secondsRemaining + "s";
        }, 1000);

        startBtn.textContent = "Refresh code";
        startBtn.disabled = false;
        stopBtn.disabled = false;

        if (settings.showLiveList) {
          fetchLiveAttendees();
          if (!liveListInterval) liveListInterval = setInterval(fetchLiveAttendees, 30000);
        }
        autoRefreshTimer = setTimeout(startAutoCycle, interval * 1000);
      }).catch(function (err) {
        startBtn.textContent = isRunning ? "Refresh code" : "Start session";
        startBtn.disabled = false;
        stopBtn.disabled = false;
        if (err.message !== "denied") {
          $("timerDisplay").textContent = "Couldn't reach the server. Press the button to try again.";
        }
      });
    }

    // ---------- Roster ----------
    function fetchLiveAttendees() {
      if (!activeSessionId || !settings.showLiveList) return;
      var btn = $("refreshListBtn");
      btn.textContent = "Loading...";
      btn.disabled = true;

      staff({ action: "getAttendees", sessionId: activeSessionId }).then(function (data) {
        btn.textContent = "Refresh list";
        btn.disabled = false;
        if (data.status !== "success") return;

        $("attendeeCount").textContent = data.count;
        var head = "<th>Time</th>";
        data.fields.forEach(function (f) { head += "<th>" + rlccEsc(f) + "</th>"; });
        $("tableHeaderRow").innerHTML = head;

        var tbody = $("attendeeTableBody");
        if (!data.attendees.length) {
          tbody.innerHTML = emptyRow(data.fields.length + 1, "No one has checked in yet.");
          return;
        }
        var rows = "";
        data.attendees.forEach(function (att) {
          rows += '<tr><td><span class="time-pill">' + rlccEsc(att.time) + "</span></td>";
          data.fields.forEach(function (f, i) {
            if (i === 0) {
              rows += '<td><div class="who"><span class="avatar">' + rlccEsc(initials(att[f])) + "</span>" + rlccEsc(att[f]) + "</div></td>";
            } else {
              rows += "<td>" + rlccEsc(att[f]) + "</td>";
            }
          });
          rows += "</tr>";
        });
        tbody.innerHTML = rows;
      }).catch(function () {
        btn.textContent = "Refresh list";
        btn.disabled = false;
      });
    }

    // ---------- Stop + report ----------
    function stopQR() {
      clearTimeout(autoRefreshTimer);
      clearInterval(countdownTimer);
      clearInterval(liveListInterval);
      liveListInterval = null;

      stopBtn.textContent = "Stopping...";
      stopBtn.disabled = true;
      startBtn.disabled = true;

      staff({ action: "stopSession" }).then(function () {
        isRunning = false;
        setLive(false, "Attendance closed");
        setState("closed", "Attendance is closed", "The code no longer works.");
        if (settings.showLiveList) fetchLiveAttendees();
        if (activeSessionId) $("emailModal").classList.add("open");
      }).catch(function (err) {
        if (err.message !== "denied") {
          $("timerDisplay").textContent = "Couldn't stop the session. Check your connection and try again.";
        }
      }).then(function () {
        startBtn.textContent = "Start session";
        stopBtn.textContent = "Stop attendance";
        startBtn.disabled = false;
        stopBtn.disabled = false;
      });
    }

    function closeModal() {
      $("emailModal").classList.remove("open");
      localStorage.removeItem("activeSessionId");
      activeSessionId = "";
    }

    function sendEmailReport() {
      var yes = $("modalYes"), no = $("modalNo");
      yes.textContent = "Sending...";
      yes.disabled = true; no.disabled = true;

      staff({ action: "sendReport", sessionId: activeSessionId }).then(function (data) {
        if (data.status === "success") {
          yes.textContent = "Sent";
          setTimeout(function () {
            closeModal();
            yes.textContent = "Send report"; yes.disabled = false; no.disabled = false;
          }, 1000);
        } else {
          throw new Error(data.message || "failed");
        }
      }).catch(function (err) {
        alert(err.message === "No admin email set"
          ? "No administrator email is set. Add ADMIN_EMAIL to the Settings sheet."
          : "The report couldn't be sent. Please try again.");
        yes.textContent = "Send report"; yes.disabled = false; no.disabled = false;
      });
    }

    startBtn.addEventListener("click", startAutoCycle);
    stopBtn.addEventListener("click", stopQR);
    $("refreshListBtn").addEventListener("click", fetchLiveAttendees);
    $("modalNo").addEventListener("click", closeModal);
    $("modalYes").addEventListener("click", sendEmailReport);

    init();
  </script>
</body>
</html>
